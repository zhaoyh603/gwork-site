# 官网发版流水线（Forgejo Actions，Issue #12）
# 只在 Forgejo 跑：放 .gitea/workflows/ 与 GitHub Pages 的 .github/workflows/deploy.yml 隔离，
# 影子仓（GitHub Actions）不读本目录，不会误执行 ECS 部署。
# runner = t638 宿主直执行（runner-linux-01，gwork 主仓 build-linux 同款）；宿主需已有
# ecs-user@39.98.121.250 免密（rsync 部署用，缺失时探测步骤明确报错）。
name: Site Deploy

on:
  push:
    branches: [main]

concurrency:
  group: site-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: 构建 + 部署 ECS + 冒烟
    runs-on: linux
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # 排查用（t638 宿主工具链；pnpm 版本须与 packageManager 一致，偏差时人审处理）
      - name: 工具链版本
        run: |
          node -v
          pnpm -v
          rsync --version

      # lockfile 的 tarball URL 绑定本地 npmmirror 镜像，registry 必须对齐（同 GitHub 版 deploy.yml）
      - name: 对齐 registry
        run: pnpm config set registry https://registry.npmmirror.com

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建前校验（type-check + lint）
        run: |
          pnpm type-check
          pnpm lint

      - name: 构建
        run: pnpm build

      # 部署：runner-site-01 固定在 ECS 本机（runner User=ecs-user，对站点目录有属主写权限），
      # 本地 rsync 即部署，无 ssh 链路。若 runner 迁回跨机形态，此处需改回 ssh + 免密探测。
      - name: 部署到站点目录
        run: rsync -az --delete dist/ /var/www/gwork-site/

      # 冒烟：index 200 + 线上 download 页引用的 bundle 与本地产物同名（部署内容一致性断言）
      - name: 线上冒烟
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' -m 15 https://www.gworkai.cn/)
          [ "$code" = "200" ] || { echo "::error::index 不可达：$code"; exit 1; }
          local_bundle=$(ls dist/assets/download-*.js | xargs -n1 basename)
          remote_bundle=$(curl -sS -m 15 https://www.gworkai.cn/download.html | grep -o 'assets/download-[a-zA-Z0-9_-]*\.js' | head -1 | xargs -n1 basename)
          echo "本地 $local_bundle / 线上 $remote_bundle"
          [ "$local_bundle" = "$remote_bundle" ] || { echo "::error::线上 bundle 与构建产物不一致"; exit 1; }
          echo "冒烟通过"
