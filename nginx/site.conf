# site.conf —— gwork.oeerp.com 官网站点基线
# 来源：2026-09-20 自生产实例 /etc/nginx/conf.d/gwork-site.conf 原样收编（仅改名与本注释）。
# 标注 `# managed by Certbot` 的行由 certbot 续期自动改写；本仓副本是基线与对照，线上以服务器为准。
#
# 本文件是 `log_format gwork_act` 的权威定义源（#410 遥测：行尾 $http_x_gwork_machine_id /
# $http_x_gwork_app_version 两字段，统计脚本按行尾两字段约定解析；重名 main 会 duplicate，
# 故不用该名）——gwork 主仓 deploy/nginx/updates.conf 跨仓引用此格式。
#
# 内网部署不适用本文件（官网是公网站点；私有化交付无官网域）。

# 活跃度日志（#410）：combined 字段 + 行尾两遥测变量；统计脚本按「行尾两字段」约定解析
# 名字不用 main：/etc/nginx/nginx.conf 已定义激活的 log_format main，重名 nginx -t 必报 duplicate
log_format gwork_act '$remote_addr - $remote_user [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" '
                     '"$http_user_agent" $http_x_gwork_machine_id $http_x_gwork_app_version';

server {
    access_log /var/log/nginx/access.log gwork_act;

    server_name gwork.oeerp.com;
    root /var/www/gwork-site;
    index index.html;

    # 页面禁缓存：assets 文件名带内容 hash，页面须每次向服务器校验才能立即拿到新版入口
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    # ^~：/updates/ 下所有请求固定走本块，不被外层正则截胡
    location ^~ /updates/ {
        alias /var/www/gwork-updates/;
        add_header Access-Control-Allow-Origin *;
        sendfile on;
        tcp_nopush on;
        client_max_body_size 1g;

        # 版本清单禁缓存：发版后官网下载页与旧站跨域读取立即生效
        # 注意：location 内一旦出现 add_header，父级头全部失效，故 CORS 头须在此重申
        location ~ \.ya?ml$    {
            default_type application/yaml;
            add_header Access-Control-Allow-Origin *;
            add_header Cache-Control "no-cache";
        }
        # 更新记录文档与清单同策略
        location ~ \.md$       {
            default_type text/markdown;
            add_header Access-Control-Allow-Origin *;
            add_header Cache-Control "no-cache";
        }
        location ~ \.blockmap$ { default_type application/octet-stream; }
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/gwork.oeerp.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/gwork.oeerp.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    access_log /var/log/nginx/access.log gwork_act;

    if ($host = gwork.oeerp.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name gwork.oeerp.com;
    return 404; # managed by Certbot


}
